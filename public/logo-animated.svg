<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Açaí do Oeste">
  <style>
    .sun { animation: rise 1.1s cubic-bezier(.2,.9,.3,1.2) both; transform-origin: 60px 66px; }
    .rays { transform-origin: 60px 66px; animation: fade .6s .9s both, spin 24s 1.5s linear infinite; }
    .berry { animation: drop .55s cubic-bezier(.3,1.6,.5,1) both; }
    .b1 { animation-delay: 1.1s } .b2 { animation-delay: 1.25s } .b3 { animation-delay: 1.4s }
    .shine { animation: fade .4s 1.7s both; }
    @keyframes rise { from { transform: translateY(40px) scale(.8); } to { transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes drop { from { transform: translateY(-46px); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="c"><circle cx="60" cy="60" r="60"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d1349"/>
      <stop offset="1" stop-color="#74308a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="120" height="120" fill="url(#sky)"/>
    <g class="rays" stroke="#f7cd70" stroke-width="5" stroke-linecap="round">
      <line x1="60" y1="17" x2="60" y2="26"/>
      <line x1="31" y1="29" x2="37" y2="36"/>
      <line x1="89" y1="29" x2="83" y2="36"/>
      <line x1="18" y1="53" x2="27" y2="55"/>
      <line x1="102" y1="53" x2="93" y2="55"/>
      <line x1="60" y1="115" x2="60" y2="106"/>
      <line x1="31" y1="103" x2="37" y2="96"/>
      <line x1="89" y1="103" x2="83" y2="96"/>
    </g>
    <circle class="sun" cx="60" cy="66" r="27" fill="#f4b740"/>
    <circle class="berry b1" cx="47" cy="59" r="8.5" fill="#2a0d33"/>
    <circle class="berry b2" cx="61" cy="54" r="8.5" fill="#2a0d33"/>
    <circle class="berry b3" cx="74" cy="60" r="8" fill="#2a0d33"/>
    <g class="shine" fill="#fff" opacity=".55">
      <circle cx="44.5" cy="56" r="2.2"/><circle cx="58.5" cy="51" r="2.2"/><circle cx="71.5" cy="57" r="2"/>
    </g>
    <path d="M18 66h84c0 22-18.8 38-42 38S18 88 18 66Z" fill="#fffaf3"/>
    <path d="M24 75h72" stroke="#5b1f6b" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
